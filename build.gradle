buildscript {
    ext.kotlin_version = "1.9.25"
    ext.compose_version = "1.7.6"
    ext.compose_compiler_version = "1.5.15"
    ext.compose_navigation_version = "2.8.5"
    ext.lifecycle_version = "2.8.7"
    ext.dagger_version = "2.54"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id "com.google.dagger.hilt.android" version "$dagger_version" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
